x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  solid-server:
    image: redpencil/mashlib-solid-server:feature-upgrade-css-and-mashlib
    volumes:
      - ./config/solid/:/config/
      # Theme tokens (config-only theming of the SolidOS shell and login widgets):
      - ./config/theming/:/config/theming/
      - ./config/landingpage/:/config/landingpage/
      - ./config/landingpage/base/index.html:/usr/app/data/index.html
      - ./config/templates/:/templates/
    environment:
      CSS_CONFIG: "/config/file_based/mashlib-files.json"
      CSS_ROOT_FILE_PATH: "./data"
