server {
    listen 80;
    server_name _;

    # Root path: only intercept HTML requests (browser navigation).
    # Non-HTML requests (Turtle, JSON-LD, HEAD, …) are proxied to CSS so that
    # Mashlib / solid-client can discover LDP and OIDC server metadata normally.
    # Without this, Mashlib fetching "/" for server discovery gets our HTML page
    # instead of an LDP container, and falls back to redirecting to /.account/.
    location = / {
        if ($http_accept ~* "text/html|application/xhtml") {
            add_header Cache-Control "no-cache";
            root /usr/share/nginx/html;
            rewrite ^ /index.html break;
        }
        proxy_pass http://solid-server:3000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else goes to the Solid server
    # (pods, /idp/, /mash.css, /mashlib.min.js, WebSockets, …)
    location / {
        proxy_pass http://solid-server:3000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Solid live-updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
